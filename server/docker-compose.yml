version: '3.8'

services:
  # Banco de dados PostgreSQL
  postgres:
    image: postgres:15-alpine
    container_name: postgres_db
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: mydb
    ports:
      - "5432:5432" # Expõe a porta para acesso externo, se necessário
    volumes:
      - pgdata:/var/lib/postgresql/data

  # Servidor RabbitMQ
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq_server
    ports:
      - "5672:5672"   # Porta para comunicação AMQP (onde scripts externos conectam)
      - "15672:15672" # Painel Web do RabbitMQ (http://localhost:15672)
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Aplicação Python
  app:
    build: .
    container_name: python_app
    depends_on:
      postgres:
        condition: service_started
      rabbitmq:
        condition: service_healthy
      #- postgres
      #- rabbitmq
    environment:
      DB_HOST: postgres
      DB_USER: admin
      DB_PASSWORD: admin
      DB_NAME: mydb
      RABBITMQ_HOST: rabbitmq

volumes:
  pgdata:
